<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Running boykisser</title>
<style>
:root{--bg:#fafaf7;--fg:#222;--mut:#666;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--fg:#eee;--mut:#9a9aa2}}
:root[data-theme="dark"]{--bg:#17171a;--fg:#eee;--mut:#9a9aa2}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:"Press Start 2P",ui-monospace,Menlo,Consolas,monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px;box-sizing:border-box;user-select:none;-webkit-user-select:none}
h1{margin:0;font-size:1.3rem}
canvas{display:block;border-radius:12px;background:#f7f7f7;touch-action:manipulation}
#wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
body.full #wrap{position:fixed;left:0;top:0;gap:0;background:var(--bg)}
#wrap.rot{transform-origin:top left;transform:rotate(90deg) translateY(-100%)}
body.full h1,body.full p{display:none}
body.full canvas{border-radius:0}
#btn{font:inherit;font-size:.9rem;padding:8px 14px;border-radius:10px;border:1px solid var(--mut);background:transparent;color:var(--fg)}
body.full #btn{position:absolute;top:8px;left:8px;z-index:2;opacity:.75;padding:6px 10px}
p{margin:0;color:var(--mut);font-size:10px;line-height:1.7;text-align:center}
#stage{position:relative;line-height:0}
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,2vmin,16px);line-height:normal;color:#fff;background:rgba(0,0,0,.3);border-radius:12px}
body.full .scr{border-radius:0}
body[data-scene="menu"] #menu,body[data-scene="skins"] #skins,body[data-scene="modes"] #modes,body[data-scene="shop"] #shop,body[data-scene="profile"] #profile{display:flex}
body:not([data-scene="game"]) p{display:none}
body[data-scene="menu"] #back{display:none}
.ttl{font-size:clamp(14px,3.6vmin,28px);line-height:1.4;margin-bottom:6px;text-align:center;text-transform:uppercase;text-shadow:3px 3px 0 #222}
.btn{position:relative;isolation:isolate;--u:3px;--fill:#535353;--line:#222;font:inherit;color:#fff;cursor:pointer;border:0;border-radius:0;background:none;filter:drop-shadow(4px 4px 0 #222);transition:transform .15s ease,filter .15s ease;-webkit-tap-highlight-color:transparent}
.btn::before,.btn::after{content:"";position:absolute;z-index:-1}
.btn::before{inset:0;background:var(--line);clip-path:polygon(0 calc(var(--u)*2),var(--u) calc(var(--u)*2),var(--u) var(--u),calc(var(--u)*2) var(--u),calc(var(--u)*2) 0,calc(100% - var(--u)*2) 0,calc(100% - var(--u)*2) var(--u),calc(100% - var(--u)) var(--u),calc(100% - var(--u)) calc(var(--u)*2),100% calc(var(--u)*2),100% calc(100% - var(--u)*2),calc(100% - var(--u)) calc(100% - var(--u)*2),calc(100% - var(--u)) calc(100% - var(--u)),calc(100% - var(--u)*2) calc(100% - var(--u)),calc(100% - var(--u)*2) 100%,calc(var(--u)*2) 100%,calc(var(--u)*2) calc(100% - var(--u)),var(--u) calc(100% - var(--u)),var(--u) calc(100% - var(--u)*2),0 calc(100% - var(--u)*2))}
.btn::after{inset:var(--u);background:var(--fill);clip-path:polygon(0 var(--u),var(--u) var(--u),var(--u) 0,calc(100% - var(--u)) 0,calc(100% - var(--u)) var(--u),100% var(--u),100% calc(100% - var(--u)),calc(100% - var(--u)) calc(100% - var(--u)),calc(100% - var(--u)) 100%,var(--u) 100%,var(--u) calc(100% - var(--u)),0 calc(100% - var(--u)))}
.btn:active{transform:scale(.92);filter:drop-shadow(2px 2px 0 #222)}
.btn.pop{animation:pop .3s ease}
@keyframes pop{50%{transform:scale(.86)}}
.mb{width:clamp(150px,42vmin,240px);height:clamp(40px,9vmin,56px);font-size:clamp(12px,2.8vmin,18px);color:#fff}
#rot{position:fixed;inset:0;z-index:200;background:#17171a;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center;font-size:13px;line-height:1.8;padding:20px}
body.portrait #rot{display:flex}
#rot i{display:block;width:34px;height:58px;border:4px solid #fff;box-shadow:4px 4px 0 #666;animation:rt 2s ease-in-out infinite}
@keyframes rt{0%,35%{transform:rotate(0)}65%,100%{transform:rotate(90deg)}}
#coins{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:calc(env(safe-area-inset-right,0px) + 10px);z-index:3;display:flex;align-items:center;gap:8px;padding:10px 14px;font-size:11px;line-height:normal;pointer-events:none;cursor:default}
#ci svg{width:16px;height:16px;display:block}
#prof{position:fixed;left:calc(env(safe-area-inset-left,0px) + 10px);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:3;display:none;padding:10px 14px;font-size:11px;line-height:normal}
body[data-scene="menu"] #prof{display:block}
#pbox{display:flex;align-items:center;gap:clamp(16px,4vmin,28px)}
#pframe{pointer-events:none;width:clamp(96px,26vmin,140px);height:clamp(96px,26vmin,140px);--fill:#fff;padding:clamp(10px,2.4vmin,16px);box-sizing:border-box;display:flex;align-items:center;justify-content:center}
#pframe img{width:100%;height:auto;display:block}
#pstats{display:flex;flex-direction:column;gap:6px;font-size:clamp(9px,2.2vmin,13px);line-height:1.4;text-shadow:2px 2px 0 #222}
#pstats b{font-size:1.5em;color:#ffe14d;font-weight:normal;margin-bottom:8px}
#items{display:flex;flex-direction:column;gap:14px;align-items:center}
.item{width:clamp(300px,82vmin,440px);padding:10px 14px;display:flex;align-items:center;gap:10px;text-align:left;color:#535353;--fill:#f1f1f1;font-size:clamp(8px,1.9vmin,11px);line-height:1.5}
.item.own{--fill:#dff5df}
.item .ic svg{width:28px;height:28px;display:block}
.item .tx{flex:1;display:flex;flex-direction:column;gap:5px}
.item small{font-size:.75em;color:#888}
.item .pc{display:flex;align-items:center;gap:4px;white-space:nowrap;color:#8a5200}
.item .pc svg{width:14px;height:14px}
.pr{display:flex;align-items:center;justify-content:center;gap:3px;min-height:12px;font-size:7px;color:#8a5200}
.pr svg{width:12px;height:12px}
.wb{width:clamp(210px,62vmin,340px);height:clamp(40px,9vmin,56px);font-size:clamp(10px,2.3vmin,15px);color:#fff}
#back{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;z-index:3;padding:10px 14px;color:#fff;font-size:11px;line-height:normal}
#cards{display:flex;gap:clamp(6px,1.6vmin,12px);flex-wrap:wrap;justify-content:center}
.card{width:clamp(72px,18vmin,100px);padding:12px 2px 8px;--fill:#e6e6e6;--line:#9a9a9a;filter:none;display:flex;flex-direction:column;align-items:center;gap:6px;color:#535353;font-size:clamp(7px,1.7vmin,10px);line-height:normal}
.card img{width:100%;height:auto;display:block}
.card.sel{--fill:#fff;--line:#222;filter:drop-shadow(4px 4px 0 #222)}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .5s ease;z-index:99}
#jump{position:fixed;right:calc(env(safe-area-inset-right,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:3;display:none;width:clamp(72px,18vmin,104px);height:clamp(72px,18vmin,104px);padding:0;border:0;background:none;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .15s ease}
body[data-scene="game"] #jump{display:block}
#jump:active{transform:scale(.88)}
#jump.pop{animation:pop .3s ease}
#jump svg{width:100%;height:100%;display:block}
.arr{animation:bob .9s steps(1,end) infinite}
@keyframes bob{50%{transform:translateY(-1px)}}
</style>

const c=document.getElementById('g'),x=c.getContext('2d');
const W=640;let H=320,G=270;c.width=W;c.height=H;
const imgs=SKINS.map(s=>{const i=new Image();i.src=s;return i});let img=imgs[skin];
const HW=60;let HH=60,TH=60;

let state='idle',dist=0,score=0,hi=0,speed=6,obs=[],cat={x:60,y:0,vy:0},frame=0,gap=0,last=0,dead=0,gx=0;
let clouds=[{x:150,y:50},{x:480,y:80},{x:720,y:40}];

function start(){obs=[];dist=0;score=0;speed=6;cat.y=0;cat.vy=0;gap=300;gx=0;inv=0;note=0;pen=0;snd=false;musicStart();if(mode==='boss')initBoss();state='run';last=performance.now();requestAnimationFrame(loop)}
function press(){
 if(scene!=="game"||busy||!full)return;
 if(state==='idle')start();
 else if(state==='over'||state==='won'){if(performance.now()-dead>(state==='won'?1900:1050))start()}
 else if(cat.y===0)cat.vy=13;
}
addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(!e.repeat)press()}});
document.body.addEventListener('pointerdown',e=>{e.preventDefault();press()});
function spawn(){
 if(score>300&&Math.random()<.3){obs.push({t:'b',x:W+20,w:34,h:22,y:Math.random()<.5?6:40})}
 else{const n=1+Math.floor(Math.random()*3);obs.push({t:'c',x:W+20,n,w:n*20-4,h:30+Math.random()*20,y:0})}
 gap=240+Math.random()*300+speed*14;
}
function update(dt){
 if(mode==='boss')return updateBoss(dt);
 if(state!=='run'){frame+=dt;return}
 frame+=dt;if(inv>0)inv-=dt;if(note>0)note-=dt;
 speed=Math.min(6+dist/2500,13);
 dist+=speed*dt;score=Math.max(0,Math.floor(dist/10)-pen);gx=(gx+speed*dt)%40;
 if(cat.y>0||cat.vy>0){cat.vy-=.7*dt;cat.y+=cat.vy*dt;if(cat.y<=0){cat.y=0;cat.vy=0;cat.sq=1}}
 if(cat.sq>0)cat.sq=Math.max(0,cat.sq-.07*dt);
 clouds.forEach(k=>{k.x-=.5*dt;if(k.x<-60){k.x=W+40;k.y=30+Math.random()*60}});
 gap-=speed*dt;if(gap<=0)spawn();
 obs.forEach(o=>o.x-=speed*dt);obs=obs.filter(o=>o.x>-80);
 const a={l:cat.x+8,r:cat.x+HW-8,t:G-cat.y-TH+8,b:G-cat.y-2};
 for(const o of obs){
  if(inv>0)continue;
  const b={l:o.x+3,r:o.x+o.w-3,t:G-o.y-o.h+3,b:G-o.y-3};
  if(a.l<b.r&&a.r>b.l&&a.t<b.b&&a.b>b.t){
   if(revive>0){revive=0;saveC();shopMark();inv=100;note=70;pen+=Math.min(500,score);obs=[];gap=220;break}
   state='over';dead=performance.now();award=score>4000?25:score>=2000?20:score>=1500?15:0;if(award)addCoins(award);
   if(score>hi){hi=score;try{localStorage.setItem('catHi',hi)}catch(e){}}
   break;
  }
 }
}
function loop(t){
 if(state!=='run'&&state!=='won'&&state!=='over')return;
 const dt=Math.min((t-last)/16.667,3);last=t;
 if(!full){requestAnimationFrame(loop);return}
 update(dt);draw();
 if(!snd&&(state==='over'||state==='won')){snd=true;sfx(state==='won'?'win':'lose')}
 if(state==='run'||(state==='won'&&performance.now()-dead<1800)||(state==='over'&&performance.now()-dead<1000))requestAnimationFrame(loop);else draw();
}
const tc=document.createElement('canvas'),tcx=tc.getContext('2d');
function drawCat(){
 if(state==='over'&&dead&&img.complete&&img.naturalWidth){
  const t=Math.min(1,(performance.now()-dead)/700),yy=cat.y*(1-Math.min(1,t*1.5));
  tc.width=img.naturalWidth;tc.height=img.naturalHeight;
  tcx.drawImage(img,0,0);tcx.globalCompositeOperation='source-atop';
  tcx.fillStyle='rgba(255,0,0,'+(.6*Math.min(1,t*2.5))+')';tcx.fillRect(0,0,tc.width,tc.height);
  x.save();x.translate(cat.x+HW,G-yy);x.rotate(t*t*Math.PI/2);
  x.drawImage(tc,-HW,-TH,HW,HH);x.restore();return;
 }
 let sy=1;
 if(cat.y>0)sy=1+.3*Math.min(Math.abs(cat.vy)/13,1);
 else if(cat.sq>0)sy=1-.32*cat.sq*Math.cos((1-cat.sq)*5);
 const sx=1/sy;
 if(img.complete&&img.naturalWidth){
  x.save();x.translate(cat.x+HW/2,G-cat.y);x.scale(sx,sy);
  x.drawImage(img,-HW/2,-TH,HW,HH);x.restore();
 }
}
function drawObs(o){
 x.fillStyle='#535353';
 if(o.t==='c'){
  for(let i=0;i<o.n;i++){
   const u=o.x+i*20,h=o.h;
   x.fillRect(u+5,G-h,7,h);
   x.fillRect(u,G-h*.55,7,4);x.fillRect(u,G-h*.55-9,4,13);
   x.fillRect(u+10,G-h*.4,7,4);x.fillRect(u+13,G-h*.4-9,4,13);
  }
 }else{
  const top=G-o.y-o.h,up=Math.floor(frame/8)%2;
  x.fillRect(o.x+6,top+8,24,8);x.fillRect(o.x+28,top+6,6,6);
  x.beginPath();x.moveTo(o.x+12,top+8);x.lineTo(o.x+22,top+8);
  if(up)x.lineTo(o.x+16,top-4);else x.lineTo(o.x+16,top+20);
  x.fill();
 }
}
function draw(){
 if(mode==='boss'&&scene==='game'){drawBoss();return}
 x.fillStyle='#f7f7f7';x.fillRect(0,0,W,H);
 x.fillStyle='#dcdcdc';
 clouds.forEach(k=>{x.fillRect(k.x,k.y,44,8);x.fillRect(k.x+10,k.y-6,24,8)});
 x.fillStyle='#535353';x.fillRect(0,G,W,2);
 for(let i=-1;i<W/40+1;i++){x.fillRect(i*40-gx+10,G+8,12,2);x.fillRect(i*40-gx+28,G+15,5,2)}
 obs.forEach(drawObs);
 if(inv<=0||Math.floor(frame/4)%2)drawCat();
 if(note>0){x.fillStyle='#e0455f';x.font='16px "Press Start 2P",monospace';x.textAlign='center';x.fillText('REBIRTH! -500',W/2,70)}
 x.fillStyle='#535353';x.font='20px "Press Start 2P",monospace';x.textAlign='right';
 x.fillText('HI '+String(hi).padStart(5,'0')+'  '+String(score).padStart(5,'0'),W-(full?135:16),34);
 x.textAlign='center';
 
 if(state==='over'&&performance.now()-dead>750){x.fillStyle='rgba(247,247,247,.78)';x.fillRect(0,0,W,H);x.textAlign='center';x.fillStyle='#535353';x.font='28px "Press Start 2P",monospace';x.fillText('DEFEAT',W/2,H/2-10);x.font='12px "Press Start 2P",monospace';x.fillText('Tap to play again',W/2,H/2+24)
  reward(W/2,H/2+66)}
}

const AC=window.AudioContext||window.webkitAudioContext;
let ac=null,master=null,mGain=null,mOn=false,nextT=0,stp=0,mTimer=null,snd=false,hatBuf=null;
const MEL=[72,76,79,76,72,76,79,0, 77,81,84,81,77,81,79,0, 79,83,86,83,79,83,81,79, 84,79,76,79,72,0,72,0, 76,81,84,81,76,81,84,0, 77,81,84,89,84,81,77,0, 79,83,86,83,79,74,71,0, 72,76,79,84,79,76,72,0];
const BASS=[48,53,55,48,45,53,55,48];
const mtof=m=>440*Math.pow(2,(m-69)/12);
function initAudio(){
 if(ac||!AC)return;
 ac=new AC();master=ac.createGain();master.gain.value=5;
 const comp=ac.createDynamicsCompressor();comp.threshold.value=-14;comp.knee.value=8;comp.ratio.value=14;comp.attack.value=.002;comp.release.value=.12;
 master.connect(comp);comp.connect(ac.destination);
 mGain=ac.createGain();mGain.gain.value=1;mGain.connect(master);
 hatBuf=ac.createBuffer(1,2205,44100);const d=hatBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
}
function tone(type,f,t,d,v,dest){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(dest);o.start(t);o.stop(t+d+.03)}
function hat(t){const s=ac.createBufferSource(),g=ac.createGain();s.buffer=hatBuf;g.gain.value=.08;s.connect(g);g.connect(mGain);s.start(t)}
function sched(){
 if(!mOn||!ac)return;
 while(nextT<ac.currentTime+.35){
  const i=stp%64,m=MEL[i],j=i%8,bs=BASS[Math.floor(i/8)];
  if(m)tone('square',mtof(m),nextT,.2,.08,mGain);
  if(j%2===0)tone('triangle',mtof(j===2||j===6?bs+7:bs),nextT,.22,.24,mGain);
  else hat(nextT);
  nextT+=.18;stp++;
 }
}
function musicStart(){if(!ac||mOn)return;mOn=true;nextT=ac.currentTime+.05;mTimer=setInterval(sched,60)}
function musicStop(){mOn=false;clearInterval(mTimer)}
function sfx(k){
 musicStop();if(!ac)return;
 const t=ac.currentTime+.05,d=master;
 if(k==='lose'){[[67,0,.22],[64,.22,.22],[60,.44,.22],[55,.66,.7]].forEach(([m,o,l])=>tone('sawtooth',mtof(m),t+o,l,.14,d))}
 else{[[60,0],[64,.12],[67,.24],[72,.36],[76,.48]].forEach(([m,o])=>tone('square',mtof(m),t+o,.25,.1,d));[72,76,79,84].forEach(m=>tone('square',mtof(m),t+.65,1,.07,d));tone('triangle',mtof(48),t+.65,1,.24,d)}
}
